$mono = FiraCode Nerd Font

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/951.png
    blur_passes = 0
    color = rgba(000000ff)
}

label {
    monitor =
    text = CachyOS
    font_size = 32
    font_family = $mono
    color = rgba(c0c0c0ff)

    position = 0, 250
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 72
    font_family = $mono
    color = rgba(00ff41ff)

    position = 0, -320
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 20
    font_family = $mono
    color = rgba(00ff41ff)

    position = 0, -380
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.35
    dots_spacing = 0.35
    dots_center = true
    inner_color = rgba(001100ff)
    outer_color = rgba(001100ff) rgba(004400ff) 90deg
    check_color = rgba(00ff41ff)
    fail_color = rgba(ff4444ff)
    font_color = rgba(00ff41ff)
    font_family = $mono
    fade_on_empty = false
    rounding = 0
    placeholder_text = Enter password to login...
    fail_text = <b>$FAIL</b>
    hide_input = false
    position = 0, -220
    halign = center
    valign = center
}

label {
    monitor =
    text = Press <b>ESC</b> to clear  |  <b>Ctrl+U</b> to reset
    font_size = 12
    font_family = $mono
    color = rgba(808080ff)

    position = 0, 50
    halign = center
    valign = bottom
}
