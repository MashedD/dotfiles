font_family FiraCode Nerd Font
font_size 16.0
bold_font auto
italic_font auto
bold_italic_font auto
enable_audio_bell no
shell_integration no-cursor
default_pointer_shape arrow
pointer_shape_when_dragging arrow
cursor #00FF00
confirm_os_window_close 0

map f11 toggle_fullscreen

# VAX Vibrant color scheme
foreground #cccccc
background #000000
selection_foreground #000000
selection_background #00ffaa

# normal
color0 #000000
color1 #ff3333
color2 #00ff55
color3 #ffff00
color4 #5555ff
color5 #ff55ff
color6 #00ffff
color7 #cccccc

# bright
color8 #666666
color9 #ff5555
color10 #55ff99
color11 #ffff55
color12 #7799ff
color13 #ff77ff
color14 #55ffff
color15 #ffffff
