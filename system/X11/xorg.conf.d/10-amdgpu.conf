# MSI AMD hybrid-GPU laptop: keep the iGPU primary and dGPU HDMI provider.
# Glamor must remain enabled: disabling it removes RandR PRIME capabilities
# and prevents the dGPU HDMI output from attaching to the iGPU desktop.
Section "Device"
    Identifier "AMD Radeon 660M (iGPU)"
    Driver "amdgpu"
    BusID "PCI:7:0:0"
    Option "PrimaryGPU" "true"
EndSection

Section "Device"
    Identifier "AMD Radeon RX 6500M (dGPU)"
    Driver "amdgpu"
    BusID "PCI:3:0:0"
    Option "DRI" "3"
    Option "TearFree" "off"
EndSection
