[skin]
description = DOS Navigator's VAX
truecolors = true

[aliases]
vax_black = #000000
vax_green = #00ff41
vax_dim_green = #00aa33
vax_silver = #c0c0c0
vax_gray = #666666
vax_yellow = #ffff00
vax_cyan = #00ffff
vax_blue = #5555ff
vax_magenta = #ff55ff
vax_red = #ff3333
vax_white = #ffffff
vax_brown = #aa5500

[Lines]
horiz = ─
vert = │
lefttop = ┌
righttop = ┐
leftbottom = └
rightbottom = ┘
topmiddle = ┬
bottommiddle = ┴
leftmiddle = ├
rightmiddle = ┤
cross = ┼
dhoriz = ═
dvert = ║
dlefttop = ╔
drighttop = ╗
dleftbottom = ╚
drightbottom = ╝
dtopmiddle = ╤
dbottommiddle = ╧
dleftmiddle = ╟
drightmiddle = ╢
#dhoriz = ─
#dvert = │
#dlefttop = ┌
#drighttop = ┐
#dleftbottom = └
#drightbottom = ┘
#dtopmiddle = ┬
#dbottommiddle = ┴
#dleftmiddle = ├
#drightmiddle = ┤

[core]
_default_ = vax_green;vax_black
selected = vax_black;vax_silver
marked = vax_yellow;vax_black;bold
markselect = vax_black;vax_yellow;bold
gauge = vax_black;vax_brown
input = vax_green;vax_black
disabled = vax_gray;vax_black
reverse = vax_black;vax_silver
header = vax_silver;vax_black
inputhistory = vax_green;vax_black
commandhistory = vax_green;vax_black
shadow = vax_gray;vax_black

[dialog]
_default_ = vax_green;vax_black
dfocus = vax_black;vax_silver
dhotnormal = vax_yellow;vax_black
dhotfocus = vax_black;vax_silver
dtitle = vax_silver;vax_black

[error]
_default_ = vax_silver;vax_black
errdfocus = vax_black;vax_silver
errdhotnormal = vax_yellow;vax_black;bold
errdhotfocus = vax_black;vax_silver;bold
errdtitle = vax_yellow;vax_black;bold

[filehighlight]
