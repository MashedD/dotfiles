<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b12"/>
      <stop offset="0.48" stop-color="#07110d"/>
      <stop offset="1" stop-color="#030a0a"/>
    </linearGradient>
    <radialGradient id="horizon" cx="58%" cy="76%" r="68%">
      <stop offset="0" stop-color="#123b35" stop-opacity="0.62"/>
      <stop offset="0.5" stop-color="#0b2625" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#07110d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbon-a" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff41" stop-opacity="0.03"/>
      <stop offset="0.38" stop-color="#00ff41" stop-opacity="0.20"/>
      <stop offset="0.72" stop-color="#70c5bd" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#78a9c4" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="ribbon-b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#70c98b" stop-opacity="0"/>
      <stop offset="0.42" stop-color="#70c98b" stop-opacity="0.17"/>
      <stop offset="0.78" stop-color="#70c5bd" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#78a9c4" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="edge-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff41" stop-opacity="0"/>
      <stop offset="0.48" stop-color="#70c98b" stop-opacity="0.62"/>
      <stop offset="0.76" stop-color="#8ce0d5" stop-opacity="0.54"/>
