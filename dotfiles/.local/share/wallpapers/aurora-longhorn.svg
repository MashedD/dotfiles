    </linearGradient>
    <pattern id="pixel-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#8ce0d5" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="shade-right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#030a0a" stop-opacity="0"/>
      <stop offset="1" stop-color="#030a0a" stop-opacity="0.48"/>
    </linearGradient>
