<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Prefer the real Microsoft face when present. Otherwise use the installed
       Arial-metric Liberation Sans, not a random generic sans-serif face. -->
  <alias binding="weak">
    <family>Microsoft Sans Serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
</fontconfig>
