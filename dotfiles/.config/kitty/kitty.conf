font_family FiraCode Nerd Font
font_size 16.0
bold_font auto
italic_font auto
bold_italic_font auto
enable_audio_bell no
shell_integration no-cursor
default_pointer_shape arrow
pointer_shape_when_dragging arrow
cursor #00ff41
confirm_os_window_close 0
window_padding_width 10

# Matching flat tab strip for multi-session terminal work.
tab_bar_style separator
tab_bar_min_tabs 2
tab_bar_edge top
active_tab_foreground #00ff41
active_tab_background #001a00
active_tab_font_style bold
inactive_tab_foreground #63736a
inactive_tab_background #101a15
inactive_tab_font_style normal
tab_separator " │ "

map f11 toggle_fullscreen
map ctrl+shift+left send_text all \x1b[1;6D
map ctrl+shift+right send_text all \x1b[1;6C

# Aurora terminal: deep forest glass, readable warm-white text, Matrix accents.
# Keep the background opaque so text stays crisp over the desktop.
foreground #c7d5cb
background #07110d
selection_foreground #07110d
selection_background #7ccf9a

# normal
color0  #101a15
color1  #d87979
color2  #70c98b
color3  #d6bd72
color4  #78a9c4
color5  #b18bbd
color6  #70c5bd
color7  #c7d5cb

# bright
color8  #63736a
color9  #f08b83
color10 #00ff41
color11 #ead28a
color12 #91c7e4
color13 #c9a0d5
color14 #8ce0d5
color15 #f0f4f1

# Keep decorative CRT/bloom effects disabled for comfortable daily use.

