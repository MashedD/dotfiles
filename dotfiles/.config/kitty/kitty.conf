font_family FiraCode Nerd Font
font_size 16.0
bold_font auto
italic_font auto
bold_italic_font auto
enable_audio_bell no
shell_integration no-cursor
default_pointer_shape arrow
pointer_shape_when_dragging arrow
cursor #00ff00
confirm_os_window_close 0
window_padding_width 0

# Matching flat tab strip for multi-session terminal work.
tab_bar_style separator
tab_bar_min_tabs 2
tab_bar_edge top
active_tab_foreground #55ff99
active_tab_background #001a00
active_tab_font_style bold
inactive_tab_foreground #666666
inactive_tab_background #000000
inactive_tab_font_style normal
tab_separator " │ "

map f11 toggle_fullscreen
map ctrl+shift+left send_text all \x1b[1;6D
map ctrl+shift+right send_text all \x1b[1;6C

# VAX Vibrant palette: true black, vivid green, and classic ANSI accents.
foreground #cccccc
background #000000
selection_foreground #000000
selection_background #00ffaa

# normal
color0  #000000
color1  #ff3333
color2  #00ff55
color3  #ffff00
color4  #5555ff
color5  #ff55ff
color6  #00ffff
color7  #cccccc

# bright
color8  #666666
color9  #ff5555
color10 #55ff99
color11 #ffff55
color12 #7799ff
color13 #ff77ff
color14 #55ffff
color15 #ffffff

# Keep decorative CRT/bloom effects disabled for comfortable daily use.

