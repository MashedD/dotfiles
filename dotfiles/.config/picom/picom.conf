# Win98/Aurora + Aero glass: keep square geometry, but composite ARGB
# translucent Awesome surfaces and blur what shows through them.
backend = "glx";
vsync = true;
use-damage = true;

shadow = false;
fading = false;
corner-radius = 0;

# Glass support for Awesome's ARGB wibars/titlebars. The blur is deliberately
# modest so the desktop stays crisp and readable.
blur-background = true;
blur-background-frame = true;
blur-background-fixed = false;
blur = {
    method = "dual_kawase";
    strength = 4;
};
blur-background-exclude = [
    "window_type = 'desktop'"
];

# Do not dim inactive windows. Honor explicit client opacity when applications
# ask for translucency, without imposing opacity on normal windows.
active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 0.96;
detect-client-opacity = true;

# Avoid fullscreen unredirect/re-redirect flicker; do not add effects by rule.
unredir-if-possible = false;
