# Win98/Aurora: keep edges square and surfaces crisp. Picom is here only for
# reliable X11 compositing and application-requested ARGB transparency.
backend = "glx";
vsync = true;
use-damage = true;

shadow = false;
fading = false;
blur-background = false;
blur-background-frame = false;
corner-radius = 0;

# Do not dim inactive windows or frames. Honor explicit client opacity when an
# application asks for translucency, without imposing it on the whole desktop.
active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;
detect-client-opacity = true;

# Avoid fullscreen unredirect/re-redirect flicker; do not add effects by rule.
unredir-if-possible = false;
