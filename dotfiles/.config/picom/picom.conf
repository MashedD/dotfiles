# Win98/Aurora + Aero glass: square geometry and explicit ARGB transparency.
# No blur, shadows, animation, dimming, or imposed frame translucency.
backend = "glx";
vsync = true;
use-damage = true;

shadow = false;
fading = false;
corner-radius = 0;

blur-background = false;
blur-background-frame = false;

# Do not dim inactive windows. Honor explicit client opacity when applications
# ask for translucency, without imposing opacity on normal windows.
active-opacity = 1.0;
inactive-opacity = 1.0;
frame-opacity = 1.0;
detect-client-opacity = true;

# Avoid fullscreen unredirect/re-redirect flicker; do not add effects by rule.
unredir-if-possible = false;
