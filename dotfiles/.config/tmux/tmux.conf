# Colors
set -g default-terminal "xterm-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"

# Fix Home and End for vim
bind-key -n Home send Escape "OH"
bind-key -n End send Escape "OF"
set-window-option -g xterm-keys on

# Default shell
set-option -g default-command "/usr/bin/zsh"
set-option -g default-shell "/usr/bin/zsh"

# Set 'Ctrl-a' instead of 'Ctrl-b' as it is easier to reach
set -g prefix C-a
unbind C-b

# Use send-prefix to pass C-a through to application
bind C-a send-prefix

# Make command delay short
set -sg escape-time 1

# Set the numbering of windows to go from 1 instead of 0
set-option -g base-index 1
setw -g pane-base-index 1

# Set ability to capture on start and restore on exit window data when running an application
setw -g alternate-screen on

# Enable mouse scroll
set -g mouse on

# Scroll History
set -g history-limit 30000

# Turn off notifications
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

# Place status bar on top
set-option -g status-position top

# Matrix98 status bar
set -g status on
set -g status-interval 5
set -g status-style "bg=colour46,fg=black"
set -g status-left-length 32
set -g status-right-length 80
set -g status-left "#[fg=black,bg=colour46,bold] #S #[fg=colour22,bg=colour46]│ "
set -g status-right "#[fg=colour22,bg=colour46]│ #[fg=black,bg=colour46]%a #[fg=black,bg=colour46,bold]%H:%M #[fg=colour22,bg=colour46]│ #[fg=black,bg=colour46]%d.%m.%y "

setw -g window-status-separator ""
setw -g window-status-format "#[fg=colour22,bg=colour46] #I:#W "
setw -g window-status-current-format "#[fg=colour46,bg=black,bold] #I:#W "
setw -g window-status-activity-style "fg=black,bg=colour46,bold"
setw -g window-status-bell-style "fg=black,bg=colour196,bold"

set -g pane-border-style "fg=colour22"
set -g pane-active-border-style "fg=colour46"
set -g display-panes-colour colour28
set -g display-panes-active-colour colour46

set -g message-style "fg=colour46,bg=black,bold"
set -g message-command-style "fg=colour46,bg=colour22,bold"
set -g mode-style "fg=black,bg=colour46,bold"
set -g popup-style "fg=colour34,bg=black"
set -g popup-border-style "fg=colour46,bg=black"
set -g menu-style "fg=colour34,bg=black"
set -g menu-selected-style "fg=black,bg=colour46,bold"
set -g menu-border-style "fg=colour46,bg=black"

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux/plugins'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.local/share/tmux/plugins/tpm/tpm'

bind C-f display-popup \
    -w 80% \
    -h 80% \
    -E "rmpc"
bind C-t display-popup \
    -d "#{pane_current_path}" \
    -E "zsh"
bind C-d display-menu -T "#[align=centre]Dotfiles" -x C -y C \
    "bash"        1  "display-popup -w 80% -h 80% -E 'vim ~/.bashrc'" \
    "zsh"         2  "display-popup -w 80% -h 80% -E 'vim ~/.config/zsh/.zshrc'" \
    "vim"         3  "display-popup -w 80% -h 80% -E 'vim ~/.config/vim/vimrc'" \
    "tmux"        4  "display-popup -w 80% -h 80% -E 'vim ~/.config/tmux/tmux.conf'" \
    "exit"        q  ""
bind C-n display-menu -T "#[align=centre]Notes" -x C -y C \
    "todo"        t  "display-popup -w 80% -h 80% -E 'vim ~/Documents/todo.txt'" \
    "notes"       n  "display-popup -w 80% -h 80% -E 'vim ~/Documents/notes.md'" \
    "exit"        q  ""

