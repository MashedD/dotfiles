# Colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-features ",xterm-256color:RGB"

# Fix Home and End for vim
bind-key -n Home send Escape "OH"
bind-key -n End send Escape "OF"
set-window-option -g xterm-keys on

# Default shell
set-option -g default-command "/usr/bin/zsh"
set-option -g default-shell "/usr/bin/zsh"

# Set 'Ctrl-a' instead of 'Ctrl-b' as it is easier to reach
set -g prefix C-a
unbind C-b

# Use send-prefix to pass C-a through to application
bind C-a send-prefix

# Make command delay short
set -sg escape-time 1

# Set the numbering of windows to go from 1 instead of 0
set-option -g base-index 1
setw -g pane-base-index 1

# Set ability to capture on start and restore on exit window data when running an application
setw -g alternate-screen on

# Enable mouse scroll
set -g mouse on

# Scroll History
set -g history-limit 30000

# Turn off notifications
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

# Place status bar on top
set-option -g status-position top

# VAX status bar
set -g status on
set -g status-interval 5
set -g status-style "bg=#000000,fg=#00aa33"
set -g status-left-length 32
set -g status-right-length 80
set -g status-left "#[fg=#c0c0c0,bg=#000000,bold] #S #[fg=#00aa33,bg=#000000]│ "
set -g status-right "#[fg=#00aa33,bg=#000000]│ #[fg=#c0c0c0,bg=#000000]%a #[fg=#ffff00,bg=#000000,bold]%H:%M #[fg=#00aa33,bg=#000000]│ #[fg=#c0c0c0,bg=#000000]%d.%m.%y "

setw -g window-status-separator ""
setw -g window-status-format "#[fg=#00aa33,bg=#000000] #I:#W "
setw -g window-status-current-format "#[fg=#00ff41,bg=#001a00,bold] #I:#W "
setw -g window-status-activity-style "fg=#000000,bg=#ffff00,bold"
setw -g window-status-bell-style "fg=#000000,bg=#ffff00,bold"

set -g pane-border-style "fg=#00aa33"
set -g pane-active-border-style "fg=#00ff41"
set -g display-panes-colour "#00aa33"
set -g display-panes-active-colour "#00ff41"

set -g message-style "fg=#ffff00,bg=#000000,bold"
set -g message-command-style "fg=#00ff41,bg=#001a00,bold"
set -g mode-style "fg=#000000,bg=#c0c0c0,bold"
set -g popup-style "fg=#00ff41,bg=#000000"
set -g popup-border-style "fg=#00ff41,bg=#000000"
set -g menu-style "fg=#00ff41,bg=#000000"
set -g menu-selected-style "fg=#000000,bg=#c0c0c0,bold"
set -g menu-border-style "fg=#00ff41,bg=#000000"

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux/plugins'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.local/share/tmux/plugins/tpm/tpm'

bind C-f display-popup \
    -w 80% \
    -h 80% \
    -E "rmpc"
bind C-t display-popup \
    -d "#{pane_current_path}" \
    -E "zsh"
bind C-d display-menu -T "#[align=centre]Dotfiles" -x C -y C \
    "bash"        1  "display-popup -w 80% -h 80% -E 'vim ~/.bashrc'" \
    "zsh"         2  "display-popup -w 80% -h 80% -E 'vim ~/.config/zsh/.zshrc'" \
    "vim"         3  "display-popup -w 80% -h 80% -E 'vim ~/.config/vim/vimrc'" \
    "tmux"        4  "display-popup -w 80% -h 80% -E 'vim ~/.config/tmux/tmux.conf'" \
    "exit"        q  ""
bind C-n display-menu -T "#[align=centre]Notes" -x C -y C \
    "todo"        t  "display-popup -w 80% -h 80% -E 'vim ~/Documents/todo.txt'" \
    "notes"       n  "display-popup -w 80% -h 80% -E 'vim ~/Documents/notes.md'" \
    "exit"        q  ""
